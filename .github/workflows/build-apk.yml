name: Build Thunder Fighter APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ThunderFighter2D-Android项目.zip'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 下载源码
        uses: actions/checkout@v4

      - name: 配置 Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装构建工具
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          sudo apt-get update
          sudo apt-get install -y unzip
          sudo apt-get install -y gradle

      - name: 解压游戏项目
        run: |
          unzip -o "ThunderFighter2D-Android项目.zip" -d project
          cp -r project/.github project/ app/ 2>/dev/null || true
          cp -r project/app .
          cp project/build.gradle .
          cp project/settings.gradle .
          cp project/gradle.properties .

      - name: 编译 APK
        run: gradle assembleDebug

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: ThunderFighter2D-APK
          path: app/build/outputs/apk/debug/app-debug.apk
